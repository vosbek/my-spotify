name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the exe to a GitHub Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller==6.11.1 pillow==11.0.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Draw the icon
        run: python packaging/make_icon.py
      - name: Build mySpotify.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --name mySpotify
          --icon packaging/mySpotify.ico --version-file packaging/version_info.txt
          --add-data "app;app" myspotify.py
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\mySpotify.exe -ArgumentList '--no-browser','--port','8899' -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
              Start-Sleep -Seconds 1
              try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8899/; $ok = $true } catch {}
            }
            if (-not $ok) { throw "mySpotify.exe did not start a server" }
            if ($r.Content -notmatch 'mySpotify') { throw "the exe served the wrong page" }
            foreach ($path in '/js/main.js', '/styles.css', '/callback') {
              $res = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8899$path"
              if ($res.StatusCode -ne 200) { throw "$path returned $($res.StatusCode)" }
            }
            Write-Host "mySpotify.exe serves the app"
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\mySpotify.exe -Algorithm SHA256).Hash.ToLower()
          "$h  mySpotify.exe" | Out-File -Encoding ascii dist\mySpotify.exe.sha256
          Get-Content dist\mySpotify.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mySpotify-windows
          path: |
            dist/mySpotify.exe
            dist/mySpotify.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mySpotify.exe
            dist/mySpotify.exe.sha256
          body: |
            **Download `mySpotify.exe` below and double-click it.** No Python needed.

            Windows may say "Windows protected your PC" because this exe is not code-signed.
            Click **More info**, then **Run anyway**. Check the download against `mySpotify.exe.sha256` if you like.

            First run: create a free app at https://developer.spotify.com/dashboard with the Redirect URI
            `http://127.0.0.1:8888/callback` (tick Web API and Web Playback SDK), then paste its Client ID.
            Spotify Premium is required to play music. Full guide: https://github.com/vosbek/my-spotify#readme
